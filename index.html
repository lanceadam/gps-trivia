<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GPS trivia night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg1:#1a1458;
    --bg2:#3a1e86;
    --bg3:#6f2a9c;
    --card:#241a5e;
    --card-light:#31226f;
    --pink:#ff2e93;
    --cyan:#3ee8ff;
    --yellow:#ffd23f;
    --purple:#b14aff;
    --cream:#fdfaff;
    --muted:#b7aee0;
    --good:#3ecf8e;
    --bad:#ff5c5c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(255,46,147,0.25), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(62,232,255,0.18), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(177,74,255,0.25), transparent 50%),
      linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    background-attachment:fixed;
    color:var(--cream);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;font-weight:800;}
  .glow-pink{text-shadow:0 0 10px rgba(255,46,147,0.85), 0 0 26px rgba(255,46,147,0.4);}
  .glow-cyan{text-shadow:0 0 10px rgba(62,232,255,0.85), 0 0 26px rgba(62,232,255,0.4);}
  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:none;
    border-radius:999px;
    font-weight:700;
    transition:transform .08s ease, opacity .15s ease, box-shadow .15s ease;
  }
  button:active{transform:scale(0.96);}
  button:disabled{opacity:.35;cursor:not-allowed;}
  input,textarea{
    font-family:'Inter',sans-serif;
    border-radius:12px;
    border:1px solid var(--card-light);
    background:var(--card);
    color:var(--cream);
    padding:11px 14px;
    font-size:16px;
  }
  input:focus,textarea:focus{outline:2px solid var(--pink);}
  .btn-primary{background:linear-gradient(135deg,var(--pink),#ff5fb0);color:white;padding:14px 26px;font-size:16px;box-shadow:0 0 18px rgba(255,46,147,0.55);}
  .btn-secondary{background:transparent;color:var(--cyan);padding:12px 22px;border:2px solid var(--cyan);box-shadow:0 0 12px rgba(62,232,255,0.25);}
  .btn-ghost{background:transparent;color:var(--muted);padding:8px 16px;border:1px solid var(--card-light);border-radius:999px;}
  .center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:16px;}
  .card{background:rgba(36,26,94,0.75);border:1px solid var(--card-light);border-radius:18px;padding:20px;backdrop-filter:blur(6px);}
  .eyebrow{color:var(--yellow);letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:700;}
  .muted{color:var(--muted);font-size:14px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px 20px;border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo-box{background:#ffffff;border-radius:12px;padding:6px 10px;display:flex;align-items:center;height:52px;}
  .brand-logo-box img{height:100%;width:auto;max-height:40px;}
  .logo{font-family:'Baloo 2',sans-serif;font-weight:700;letter-spacing:.01em;font-size:16px;}
  .logo span{color:var(--pink);}
  .controlbar{
    position:sticky;bottom:0;background:rgba(20,15,60,0.96);
    border-top:1px solid rgba(255,255,255,0.08);
    padding:12px 16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  }
  .question-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 24px;gap:26px;}
  .qtext{font-size:clamp(24px,4vw,42px);max-width:900px;line-height:1.25;}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:900px;width:100%;}
  @media (max-width:600px){.options{grid-template-columns:1fr;}}
  .opt{
    background:var(--card);border:2px solid var(--card-light);border-radius:16px;
    padding:18px;font-size:18px;text-align:left;color:var(--cream);
  }
  .opt.correct{border-color:var(--good);background:rgba(62,207,142,0.15);box-shadow:0 0 16px rgba(62,207,142,0.4);}
  .opt.selected{border-color:var(--pink);box-shadow:0 0 14px rgba(255,46,147,0.4);}
  table.lb{border-collapse:collapse;width:100%;max-width:640px;}
  table.lb td,table.lb th{padding:12px 14px;text-align:left;border-bottom:1px solid var(--card-light);}
  table.lb th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;}
  .rank{font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--yellow);width:36px;}
  .me{background:rgba(255,46,147,0.14);border-radius:10px;}
  .pill{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--card-light);font-size:12px;color:var(--muted);}
  textarea.editor{width:100%;min-height:280px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5;}
  .answer-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--card-light);font-size:14px;gap:10px;}
  a{color:var(--cyan);}
  /* sponsor footer */
  .sponsor-footer{
    padding:14px 16px 18px;text-align:center;border-top:1px solid rgba(255,255,255,0.08);
  }
  .sponsor-footer .eyebrow{margin-bottom:10px;display:block;}
  .sponsor-row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .sponsor-chip{
    border-radius:14px;padding:12px 20px;display:flex;align-items:center;justify-content:center;
    height:64px;
  }
  .sponsor-chip.light{background:#ffffff;}
  .sponsor-chip.dark{background:#151024;}
  .sponsor-chip img{height:100%;max-height:44px;width:auto;object-fit:contain;}
  .timer-badge{
    font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:30px;
    color:var(--cyan);border:3px solid var(--cyan);border-radius:999px;
    width:76px;height:76px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 16px rgba(62,232,255,0.35);
  }
  .timer-badge.small{width:56px;height:56px;font-size:20px;border-width:2px;}
  .coin-wrap{perspective:1000px;margin:8px 0;}
  .coin{width:150px;height:150px;position:relative;transform-style:preserve-3d;}
  .coin-face{
    position:absolute;width:100%;height:100%;border-radius:50%;
    display:flex;align-items:center;justify-content:center;backface-visibility:hidden;
    font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:46px;
    box-shadow:0 0 26px rgba(0,0,0,0.35), inset 0 0 0 6px rgba(255,255,255,0.25);
  }
  .coin-heads{background:linear-gradient(135deg,var(--yellow),#ffb703);color:#151024;}
  .coin-tails{background:linear-gradient(135deg,var(--purple),var(--pink));color:white;transform:rotateY(180deg);}
  @keyframes coinSpinHeads{ from{transform:rotateY(0deg);} to{transform:rotateY(1800deg);} }
  @keyframes coinSpinTails{ from{transform:rotateY(0deg);} to{transform:rotateY(1980deg);} }
</style>
</head>

function slug(name){
  return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || ('team-'+Math.random().toString(36).slice(2,7));
}

function isUrl(s){ return typeof s === 'string' && /^https?:\/\//i.test(s.trim()); }
function isImageRef(s){ return typeof s === 'string' && (isUrl(s) || /^IMG:/i.test(s.trim())); }
function resolveImageRef(s){
  if(!s) return null;
  const t = s.trim();
  if(/^IMG:/i.test(t)){
    const key = t.slice(4).trim();
    return (typeof LOGOS !== 'undefined' && LOGOS[key]) ? LOGOS[key] : null;
  }
  return isUrl(t) ? t : null;
}

function parseConfig(text){
  const lines = text.split('\n');
  const rounds = [];
  let ri = -1, qi = 0;
  const headerRe = /^###\s*(.+?)(?:\s*\[type:\s*([a-z_]+)\s*\])?\s*$/i;
  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;
    if(line.startsWith('###')){
      ri++; qi = 0;
      const m = line.match(headerRe);
      const name = m ? m[1].trim() : line.replace(/^###\s*/,'');
      const type = m && m[2] ? m[2].toLowerCase() : 'trivia';
      rounds.push({ name, type, questions: [] });
      continue;
    }
    if(ri < 0) continue;
    const upper = line.toUpperCase();
    if(upper.startsWith('MC |') || upper.startsWith('MC|')){
      const parts = line.split('|').map(s=>s.trim());
      let image = null, imageRef = null;
      let last = parts[parts.length-1];
      let correctIdx, options;
      if(isImageRef(last)){
        imageRef = last; image = resolveImageRef(last);
        correctIdx = parseInt(parts[parts.length-2], 10);
        options = parts.slice(2, parts.length-2);
      } else {
        correctIdx = parseInt(last, 10);
        options = parts.slice(2, parts.length-1);
      }
      rounds[ri].questions.push({
        id: `r${ri}q${qi}`, type:'mc', text: parts[1], options, correct: correctIdx, image, imageRef, points: 1
      });
      qi++;
    } else if(upper.startsWith('DOA |') || upper.startsWith('DOA|')){
      const parts = line.split('|').map(s=>s.trim());
      const imageRef = parts[2] || null;
      rounds[ri].questions.push({
        id: `r${ri}q${qi}`, type:'mc', text: parts[1], options: ['Dead','Alive'],
        correct: parseInt(parts[3], 10), image: resolveImageRef(imageRef), imageRef, points: 1
      });
      qi++;
    } else if(upper.startsWith('SHORT |') || upper.startsWith('SHORT|')){
      const parts = line.split('|').map(s=>s.trim());
      const imageRef = parts[3] && isImageRef(parts[3]) ? parts[3] : null;
      rounds[ri].questions.push({
        id: `r${ri}q${qi}`, type:'short', text: parts[1], answer: parts[2] || '', image: resolveImageRef(imageRef), imageRef, points: 1
      });
      qi++;
    } else if(upper.startsWith('LYRIC |') || upper.startsWith('LYRIC|')){
      const parts = line.split('|').map(s=>s.trim());
      rounds[ri].questions.push({
        id: `r${ri}q${qi}`, type:'lyric', text: parts[1], youtube: parts[2] || '', points: 1
      });
      qi++;
    } else if(upper.startsWith('NHIE |') || upper.startsWith('NHIE|')){
      const parts = line.split('|').map(s=>s.trim());
      rounds[ri].questions.push({
        id: `r${ri}q${qi}`, type:'nhie', text: parts[1]
      });
      qi++;
    } else if(upper.startsWith('AUCTION |') || upper.startsWith('AUCTION|')){
      const parts = line.split('|').map(s=>s.trim());
      const imagesRefRaw = parts[4] || null;
      const images = imagesRefRaw
        ? imagesRefRaw.split(',').map(s=>resolveImageRef(s.trim())).filter(Boolean)
        : [];
      rounds[ri].questions.push({
        id: `r${ri}q${qi}`, type:'auction', text: parts[1], description: parts[2] || '', detail: parts[3] || '',
        images, imagesRef: imagesRefRaw
      });
      qi++;
    }
  }
  return { rounds };
}

function configToText(cfg){
  let out = [];
  cfg.rounds.forEach(r=>{
    const typeSuffix = r.type && r.type !== 'trivia' ? ` [type: ${r.type}]` : '';
    out.push(`### ${r.name}${typeSuffix}`);
    (r.questions||[]).forEach(q=>{
      if(q.type==='mc'){
        const img = q.imageRef ? ` | ${q.imageRef}` : '';
        out.push(`MC | ${q.text} | ${q.options.join(' | ')} | ${q.correct}${img}`);
      } else if(q.type==='short'){
        const img = q.imageRef ? ` | ${q.imageRef}` : '';
        out.push(`SHORT | ${q.text} | ${q.answer}${img}`);
      } else if(q.type==='lyric'){
        out.push(`LYRIC | ${q.text} | ${q.youtube}`);
      } else if(q.type==='nhie'){
        out.push(`NHIE | ${q.text}`);
      } else if(q.type==='auction'){
        const img = q.imagesRef ? ` | ${q.imagesRef}` : '';
        out.push(`AUCTION | ${q.text} | ${q.description} | ${q.detail}${img}`);
      }
    });
    out.push('');
  });
  return out.join('\n').trim();
}

function youtubeEmbedUrl(url){
  if(!url) return null;
  let id = null;
  const m1 = url.match(/[?&]v=([^&]+)/);
  const m2 = url.match(/youtu\.be\/([^?&]+)/);
  if(m1) id = m1[1];
  else if(m2) id = m2[1];
  if(!id) return null;
  return `https://www.youtube.com/embed/${id}?autoplay=1`;
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

/* ===================== Supabase data layer =====================
  Same entry points the app has always used (storageGet / storageSet /
  storageListKeys), now backed by Supabase tables:
    trivia-config            -> config        (single row, id=1)
    trivia-state             -> session_state (single row, id=1)
    trivia-teams             -> teams         (one row per team)
    trivia-answers:{teamKey} -> answers       (one row per team+question)
    trivia-marks             -> marks         (one row per question+team)
  Setting an object merges (row upserts) so two teams joining at the
  same moment can't clobber each other; setting {} clears the table.
================================================================ */

const SUPABASE_URL = "https://kviwgzetjyzgcjrmgzop.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_DguJllmyeACJL6u-LgHCww_T3T2ZLLN";
const ANSWERS_PREFIX = 'trivia-answers:';

let sb = null;
function sbClient(){
  if(!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return sb;
}

async function storageGet(key, shared, attempt=0){
  try{
    const db = sbClient();
    let out = null;
    if(key === 'trivia-config'){
      const { data, error } = await db.from('config').select('rounds,rules,join_url').eq('id',1).maybeSingle();
      if(error) throw error;
      out = data ? { rounds: data.rounds || [], rules: data.rules || '', joinUrl: data.join_url || '' } : null;
    } else if(key === 'trivia-state'){
      const { data, error } = await db.from('session_state').select('state').eq('id',1).maybeSingle();
      if(error) throw error;
      out = data ? data.state : null;
    } else if(key === 'trivia-teams'){
      const { data, error } = await db.from('teams').select('team_key,name,joined_at');
      if(error) throw error;
      out = {};
      (data||[]).forEach(r=>{ out[r.team_key] = { name: r.name, joinedAt: Number(r.joined_at) }; });
    } else if(key === 'trivia-marks'){
      const { data, error } = await db.from('marks').select('question_id,team_key,correct');
      if(error) throw error;
      out = {};
      (data||[]).forEach(r=>{ (out[r.question_id] = out[r.question_id] || {})[r.team_key] = r.correct; });
    } else if(key.startsWith(ANSWERS_PREFIX)){
      const tk = key.slice(ANSWERS_PREFIX.length);
      const { data, error } = await db.from('answers').select('question_id,value').eq('team_key', tk);
      if(error) throw error;
      out = {};
      (data||[]).forEach(r=>{ out[r.question_id] = r.value; });
    }
    syncOk = true;
    return out;
  }catch(e){
    if(attempt < 2){ await sleep(400 * (attempt+1)); return storageGet(key, shared, attempt+1); }
    console.error('storage get failed', key, e);
    syncOk = false;
    return null;
  }
}

async function storageSet(key, value, shared, attempt=0){
  try{
    const db = sbClient();
    if(key === 'trivia-config'){
      const { error } = await db.from('config').upsert({ id:1, rounds: value.rounds||[], rules: value.rules||'', join_url: value.joinUrl||'' });
      if(error) throw error;
    } else if(key === 'trivia-state'){
      const { error } = await db.from('session_state').upsert({ id:1, state: value });
      if(error) throw error;
    } else if(key === 'trivia-teams'){
      const rows = Object.entries(value||{}).map(([tk,t])=>({ team_key: tk, name: t.name, joined_at: t.joinedAt }));
      if(!rows.length){
        const { error } = await db.from('teams').delete().neq('team_key','');
        if(error) throw error;
      } else {
        const { error } = await db.from('teams').upsert(rows);
        if(error) throw error;
      }
    } else if(key === 'trivia-marks'){
      const rows = [];
      Object.entries(value||{}).forEach(([qid, per])=>{
        Object.entries(per||{}).forEach(([tk, c])=> rows.push({ question_id: qid, team_key: tk, correct: !!c }));
      });
      if(!rows.length){
        const { error } = await db.from('marks').delete().neq('question_id','');
        if(error) throw error;
      } else {
        const { error } = await db.from('marks').upsert(rows);
        if(error) throw error;
      }
    } else if(key.startsWith(ANSWERS_PREFIX)){
      const tk = key.slice(ANSWERS_PREFIX.length);
      const rows = Object.entries(value||{}).map(([qid,v])=>({ team_key: tk, question_id: qid, value: String(v) }));
      if(rows.length){
        const { error } = await db.from('answers').upsert(rows);
        if(error) throw error;
      }
    }
    syncOk = true;
  }catch(e){
    if(attempt < 2){ await sleep(400 * (attempt+1)); return storageSet(key, value, shared, attempt+1); }
    console.error('storage set failed', key, e);
    syncOk = false;
  }
}

async function storageListKeys(prefix, shared, attempt=0){
  try{
    const { data, error } = await sbClient().from('answers').select('team_key');
    if(error) throw error;
    syncOk = true;
    return [...new Set((data||[]).map(r=>r.team_key))].map(tk=> ANSWERS_PREFIX + tk);
  }catch(e){
    if(attempt < 2){ await sleep(400 * (attempt+1)); return storageListKeys(prefix, shared, attempt+1); }
    console.error('storage list failed', prefix, e);
    syncOk = false;
    return [];
  }
}

async function storageDelete(key, shared){
  try{
    if(key.startsWith(ANSWERS_PREFIX)){
      const tk = key.slice(ANSWERS_PREFIX.length);
      const { error } = await sbClient().from('answers').delete().eq('team_key', tk);
      if(error) throw error;
    }
    syncOk = true;
  }catch(e){
    console.error('storage delete failed', key, e);
    syncOk = false;
  }
}

// One query for every team's answers (used by loadAll on all devices).
async function storageGetAllAnswers(){
  try{
    const { data, error } = await sbClient().from('answers').select('team_key,question_id,value');
    if(error) throw error;
    const out = {};
    (data||[]).forEach(r=>{ (out[r.team_key] = out[r.team_key] || {})[r.question_id] = r.value; });
    syncOk = true;
    return out;
  }catch(e){
    console.error('answers fetch failed', e);
    syncOk = false;
    return null;
  }
}

async function loadAll(){
  const c = await storageGet('trivia-config', true);
  if(c) config = { rounds: c.rounds || [], rules: c.rules || DEFAULT_RULES, joinUrl: c.joinUrl || '' };
  const s = await storageGet('trivia-state', true);
  if(s) sessionState = s;
  const t = await storageGet('trivia-teams', true);
  if(t) teams = t;
  const m = await storageGet('trivia-marks', true);
  if(m) marks = m;
  // Every device loads all answers (one query) — teams need them so the
  // leaderboard can score other tables' MC answers, not just their own.
  const bulk = await storageGetAllAnswers();
  if(bulk) allAnswers = bulk;
  if(role === 'team' && teamKey){
    myAnswers = { ...(allAnswers[teamKey] || {}), ...myAnswers };
  }
}

/* ---------- live sync: realtime subscription + fallback poll ---------- */

let syncChannel = null;
let syncDebounce = null;
let pendingRender = false;

// Don't blow away anything the user is mid-typing (setup textareas,
// team name, short answers). Render is deferred until the input blurs.
function guardedRender(){
  const ae = document.activeElement;
  if(ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT')){ pendingRender = true; return; }
  render();
}

async function refreshFromRemote(){
  if(role === 'host' && sessionState.screen === 'setup') return; // setup edits are local until saved
  await loadAll();
  guardedRender();
}

function queueRefresh(){
  clearTimeout(syncDebounce);
  syncDebounce = setTimeout(refreshFromRemote, 350);
}

function startSync(){
  if(syncChannel) return;
  syncChannel = sbClient()
    .channel('trivia-sync')
    .on('postgres_changes', { event: '*', schema: 'public' }, queueRefresh)
    .subscribe();
  // Safety net in case a realtime message is dropped.
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshFromRemote, 10000);
  document.addEventListener('blur', ()=>{
    if(pendingRender){ pendingRender = false; render(); }
  }, true);
}

const QUESTION_TIMER_SECONDS = 60;
const GAME_ROUND_TYPES = ['headsortails', 'nhie', 'lyric', 'eliminator', 'game'];
function isGameRound(round){ return round && GAME_ROUND_TYPES.includes(round.type); }

let lastAutoAdvanceFor = null;
function tickCountdown(){
  const started = sessionState.extra && sessionState.extra.questionStartedAt;
  const badges = document.querySelectorAll('.timer-badge');
  let text = String(QUESTION_TIMER_SECONDS);
  let urgent = false;
  let remaining = QUESTION_TIMER_SECONDS;
  if(started){
    remaining = Math.max(0, QUESTION_TIMER_SECONDS - Math.floor((Date.now() - started) / 1000));
    text = remaining > 0 ? String(remaining) : "0";
    urgent = remaining <= 10;
  }
  badges.forEach(b=>{
    b.textContent = text;
    b.style.color = urgent ? 'var(--pink)' : 'var(--cyan)';
    b.style.borderColor = urgent ? 'var(--pink)' : 'var(--cyan)';
  });

  // Auto-advance only the main numbered rounds, only from the host device, only once per question.
  if(role === 'host' && sessionState.screen === 'question' && started){
    const round = config.rounds[sessionState.roundIndex];
    if(round && round.type === 'trivia' && !isGameRound(round) && remaining <= 0 && lastAutoAdvanceFor !== started){
      lastAutoAdvanceFor = started;
      hostNextQuestion();
    }
  }
}
setInterval(tickCountdown, 1000);

function currentQuestion(){
  const r = config.rounds[sessionState.roundIndex];
  if(!r) return null;
  return r.questions[sessionState.questionIndex] || null;
}

function getAnswerFor(tk, qid){
  if(tk === teamKey && myAnswers[qid] !== undefined) return myAnswers[qid];
  return (allAnswers[tk]||{})[qid];
}
function hasAnswered(q, tk){
  const ans = getAnswerFor(tk, q.id);
  return ans !== undefined && ans !== null && ans !== '';
}
function isCorrect(q, tk){
  if(!hasAnswered(q, tk)) return false;
  const ans = getAnswerFor(tk, q.id);
  if(q.type === 'mc') return Number(ans) === Number(q.correct);
  if(q.type === 'short' || q.type === 'lyric') return !!(marks[q.id] && marks[q.id][tk]);
  return false;
}
// Is this team already out of an eliminator round by the time we reach question index uptoIdx?
function isEliminated(round, uptoIdx, tk){
  if(!round || round.type !== 'eliminator') return false;
  for(let i=0;i<uptoIdx;i++){
    const q = round.questions[i];
    if(!q) continue;
    if(!isCorrect(q, tk)) return true;
  }
  return false;
}

function computeScores(){
  const result = {};
  Object.keys(teams).forEach(tk=>{
    result[tk] = { teamKey: tk, name: teams[tk].name, roundScores: config.rounds.map(()=>0), total: 0 };
  });
  config.rounds.forEach((round, ri)=>{
    if(round.type === 'eliminator') return; // extra stand/sit game, not part of official scoring
    (round.questions||[]).forEach((q, qi)=>{
      if(q.type === 'nhie' || q.type === 'auction') return; // never scored
      Object.keys(teams).forEach(tk=>{
        if(isCorrect(q, tk)){
          result[tk].roundScores[ri] += q.points;
          result[tk].total += q.points;
        }
      });
    });
  });
  return Object.values(result).sort((a,b)=>b.total-a.total);
}

async function hostSaveConfigFromText(roundsText, rulesText){
  const parsed = parseConfig(roundsText);
  config = { rounds: parsed.rounds, rules: rulesText, joinUrl: config.joinUrl || '' };
  await storageSet('trivia-config', config, true);
  render();
}

async function hostSetState(patch){
  sessionState = { ...sessionState, ...patch };
  await storageSet('trivia-state', sessionState, true);
  render();
}

async function hostGoLobby(){ await hostSetState({ screen:'lobby' }); }
async function hostStartRound(ri){ await hostSetState({ screen:'question', roundIndex: ri, questionIndex: 0, extra: { questionStartedAt: Date.now() } }); }
async function hostNextQuestion(){
  const r = config.rounds[sessionState.roundIndex];
  if(sessionState.questionIndex + 1 < r.questions.length){
    await hostSetState({ screen:'question', questionIndex: sessionState.questionIndex+1, extra: { questionStartedAt: Date.now() } });
  } else if(r.type === 'eliminator'){
    await hostSetState({ screen:'survivors' });
  } else if(isGameRound(r)){
    await hostShowAnswers();
  } else {
    await hostNextRound();
  }
}
async function hostShowAnswers(){
  await hostSetState({ screen:'answers', questionIndex: 0 });
}
async function hostAnswersGo(delta){
  const round = config.rounds[sessionState.roundIndex - 1];
  if(!round) return;
  const next = Math.min(Math.max(sessionState.questionIndex + delta, 0), round.questions.length - 1);
  await hostSetState({ questionIndex: next });
}
async function hostPrevQuestion(){
  if(sessionState.questionIndex > 0){
    await hostSetState({ screen:'question', questionIndex: sessionState.questionIndex-1, extra: { questionStartedAt: Date.now() } });
  }
}
async function hostReveal(){ await hostSetState({ screen:'reveal' }); }
async function hostShowLeaderboard(){ await hostSetState({ screen:'leaderboard' }); }
async function hostNextRound(){
  const nextRi = sessionState.roundIndex + 1;
  if(nextRi < config.rounds.length){
    await hostSetState({ screen:'question', roundIndex: nextRi, questionIndex: 0, extra: {} });
  } else {
    await hostSetState({ screen:'end' });
  }
}
async function hostFlipCoin(){
  const result = Math.random() < 0.5 ? 'Heads' : 'Tails';
  const flipCount = ((sessionState.extra && sessionState.extra.flipCount) || 0) + 1;
  await hostSetState({ extra: { ...sessionState.extra, flipResult: result, flipCount } });
}
async function hostNhieGo(delta){
  const round = config.rounds[sessionState.roundIndex];
  const next = Math.min(Math.max(sessionState.questionIndex + delta, 0), round.questions.length - 1);
  await hostSetState({ questionIndex: next });
}
async function hostMark(qid, tk, correct){
  if(!marks[qid]) marks[qid] = {};
  marks[qid][tk] = correct;
  await storageSet('trivia-marks', marks, true);
  render();
}
async function hostResetEvent(){
  if(!confirm('Reset the whole event? This clears teams, answers, marks and state.')) return;
  const keys = await storageListKeys('trivia-answers:', true);
  for(const k of keys){ try{ await storageDelete(k, true); }catch(e){} }
  teams = {}; marks = {}; allAnswers = {};
  await storageSet('trivia-teams', {}, true);
  await storageSet('trivia-marks', {}, true);
  await hostSetState({ screen:'setup', roundIndex:0, questionIndex:0 });
}

async function teamJoin(name){
  const key = slug(name);
  const t = await storageGet('trivia-teams', true) || {};
  if(!t[key]) t[key] = { name: name.trim(), joinedAt: Date.now() };
  teams = t;
  await storageSet('trivia-teams', teams, true);
  teamKey = key; teamName = teams[key].name;
  myAnswers = await storageGet('trivia-answers:'+teamKey, true) || {};
  render();
}

async function teamSubmitAnswer(qid, value){
  myAnswers[qid] = value;
  await storageSet('trivia-answers:'+teamKey, myAnswers, true);
  render();
}

function renderHostQuestion(){
  const round = config.rounds[sessionState.roundIndex];
  if(round.type === 'headsortails') return renderHostHeadsOrTails(round);
  if(round.type === 'nhie') return renderHostNhie(round);
  if(round.type === 'auction') return renderHostAuction(round);

  const q = currentQuestion();
  if(!q){
    const wrap = el(`
      <div class="center-screen">
        <div class="eyebrow">${round.name}</div>
        <h2 class="display" style="margin:0;">No questions in this round yet</h2>
        <p class="muted">Add some MC, SHORT, or DOA lines under this round in setup, or skip past it for now.</p>
      </div>
      <div class="controlbar">
        <button class="btn-ghost" id="back-lobby">Back to lobby</button>
        <button class="btn-primary" id="skip-round">Skip to next round</button>
      </div>
    `);
    wrap.querySelector('#back-lobby').onclick = hostGoLobby;
    wrap.querySelector('#skip-round').onclick = ()=> isGameRound(round) ? hostShowAnswers() : hostNextRound();
    return wrap;
  }

  if(q.type === 'lyric') return renderHostLyricQuestion(round, q);

  const answeredCount = Object.keys(allAnswers).filter(tk => allAnswers[tk] && allAnswers[tk][q.id] !== undefined).length;
  let statusPill;
  if(round.type === 'eliminator'){
    const remaining = Object.keys(teams).filter(tk => !isEliminated(round, sessionState.questionIndex, tk)).length;
    statusPill = `${remaining} of ${Object.keys(teams).length} tables still in`;
  } else {
    statusPill = `${answeredCount} of ${Object.keys(teams).length} teams answered`;
  }

  const isRealRound = round.type === 'trivia' && !isGameRound(round);
  const controls = isRealRound
    ? `<button class="btn-ghost" id="prev-q" ${sessionState.questionIndex===0 ? 'disabled':''}>Previous</button>
       <button class="btn-primary" id="next-q">Skip to next question</button>`
    : `<button class="btn-ghost" id="prev-q" ${sessionState.questionIndex===0 ? 'disabled':''}>Previous</button>
       <button class="btn-secondary" id="reveal-q">Reveal answer</button>
       <button class="btn-primary" id="next-q">Next question</button>`;

  const wrap = el(`
    <div class="question-stage">
      <div class="eyebrow">${round.name} &middot; question ${sessionState.questionIndex+1} of ${round.questions.length}</div>
      <div class="timer-badge">${QUESTION_TIMER_SECONDS}</div>
      ${q.image ? `<img src="${q.image}" alt="" style="max-width:360px;max-height:280px;border-radius:16px;object-fit:cover;box-shadow:0 0 24px rgba(0,0,0,0.4);">` : ''}
      <div class="qtext display">${q.text}</div>
      ${q.type==='mc' ? `<div class="options">${q.options.map((o,i)=>`<div class="opt">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div>` : ''}
      <div class="pill">${statusPill}</div>
    </div>
    <div class="controlbar">${controls}</div>
  `);
  wrap.querySelector('#prev-q').onclick = hostPrevQuestion;
  if(!isRealRound) wrap.querySelector('#reveal-q').onclick = hostReveal;
  wrap.querySelector('#next-q').onclick = hostNextQuestion;
  return wrap;
}

let lastAnimatedFlipCount = null;
function coinMarkup(extra){
  const result = extra.flipResult;
  const isTails = result === 'Tails';
  const shouldAnimate = extra.flipCount && extra.flipCount !== lastAnimatedFlipCount;
  if(extra.flipCount) lastAnimatedFlipCount = extra.flipCount;
  let styleAttr = '';
  if(shouldAnimate){
    styleAttr = `animation: coinSpin${isTails ? 'Tails' : 'Heads'} 1.6s cubic-bezier(.25,.8,.4,1) forwards;`;
  } else if(result){
    styleAttr = `transform: rotateY(${isTails ? 1980 : 1800}deg);`;
  }
  return `
    <div class="coin-wrap">
      <div class="coin" style="${styleAttr}">
        <div class="coin-face coin-heads">H</div>
        <div class="coin-face coin-tails">T</div>
      </div>
    </div>
  `;
}

function renderMarkList(q){
  const list = document.createElement('div');
  const teamKeys = Object.keys(teams);
  if(!teamKeys.length){ list.innerHTML = '<p class="muted">No teams registered.</p>'; return list; }
  teamKeys.forEach(tk=>{
    const ans = (allAnswers[tk]||{})[q.id];
    const row = el(`
      <div class="answer-row">
        <span>${teams[tk].name}${q.type==='short' ? `: <strong>${ans !== undefined && ans !== '' ? ans : '(no answer)'}</strong>` : ''}</span>
        <span class="row" style="gap:6px;">
          <button class="btn-secondary" style="padding:6px 12px;border-color:${marks[q.id]&&marks[q.id][tk]===true?'var(--good)':'var(--card-light)'};color:${marks[q.id]&&marks[q.id][tk]===true?'var(--good)':'var(--muted)'}" data-tk="${tk}" data-val="1">Correct</button>
          <button class="btn-secondary" style="padding:6px 12px;border-color:${marks[q.id]&&marks[q.id][tk]===false?'var(--bad)':'var(--card-light)'};color:${marks[q.id]&&marks[q.id][tk]===false?'var(--bad)':'var(--muted)'}" data-tk="${tk}" data-val="0">Incorrect</button>
        </span>
      </div>
    `);
    row.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=> hostMark(q.id, b.dataset.tk, b.dataset.val==='1');
    });
    list.appendChild(row);
  });
  return list;
}

    const wrap = el(`
      <div class="question-stage">

        <div class="qtext display glow-pink">${q.text}</div>
        ${embed ? `<div class="card" style="width:100%;max-width:640px;padding:8px;"><iframe width="100%" height="360" src="${embed}" title="song clip" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen style="border-radius:12px;"></iframe></div>` : `<p class="muted">No video link for this one.</p>`}

    wrap.querySelector('#back-q').onclick = ()=> hostSetState({ screen:'question' });
    wrap.querySelector('#to-next').onclick = hostNextQuestion;
    return wrap;
  }

  const wrap = el(`
    <div class="question-stage">
      <div class="eyebrow">Answer reveal</div>
      ${q.image ? `<img src="${q.image}" alt="" style="max-width:360px;max-height:280px;border-radius:16px;object-fit:cover;box-shadow:0 0 24px rgba(0,0,0,0.4);">` : ''}
      <div class="qtext display">${q.text}</div>
      ${q.type==='mc'
        ? `<div class="options">${q.options.map((o,i)=>`<div class="opt ${i===q.correct?'correct':''}">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div>`
        : `<div class="card" style="max-width:700px;width:100%;">
             <p><strong>Reference answer:</strong> ${q.answer || '(none given)'}</p>
             <div id="mark-list"></div>
           </div>`
      }
      ${round.type === 'eliminator' ? `<div class="card" style="max-width:700px;width:100%;"><div class="eyebrow">Still in it</div><div id="elim-list"></div></div>` : ''}
    </div>
    <div class="controlbar">
      <button class="btn-ghost" id="back-q">Back to question</button>
      <button class="btn-primary" id="to-next">Next question</button>
    </div>
  `);
  if(q.type === 'short'){
    wrap.querySelector('#mark-list').appendChild(renderMarkList(q));
  }
  if(round.type === 'eliminator'){
    const elimList = wrap.querySelector('#elim-list');
    Object.keys(teams).forEach(tk=>{
      const wasAlready = isEliminated(round, sessionState.questionIndex, tk);
      const correctNow = isCorrect(q, tk);
      const status = wasAlready ? 'already out' : (correctNow ? 'still in' : 'out this round');
      const color = wasAlready ? 'var(--muted)' : (correctNow ? 'var(--good)' : 'var(--bad)');
      elimList.appendChild(el(`<div class="answer-row"><span>${teams[tk].name}</span><span style="color:${color};font-weight:600;">${status}</span></div>`));
    });
  }
  wrap.querySelector('#back-q').onclick = ()=> hostSetState({ screen:'question' });
  wrap.querySelector('#to-next').onclick = hostNextQuestion;
  return wrap;
}

function renderTeam(){
  const wrap = document.createElement('div');
  wrap.style.display='flex';
  wrap.style.flexDirection='column';
  wrap.style.minHeight='100vh';
  const namePill = teamName ? el(`<span class="pill">${teamName}</span>`) : null;
  wrap.appendChild(renderTopbar(namePill ? [namePill] : []));

  if(!teamKey){
    const join = el(`
      <div class="center-screen">
        <div class="eyebrow">Join tonight's trivia</div>
        <h2 class="display" style="margin:0;">What's your team name?</h2>
        <input id="team-name" placeholder="e.g. Quiz Pistols" style="width:260px;text-align:center;">
        <button class="btn-primary" id="join-btn">Join</button>
        <p class="muted">If you get disconnected, just re-enter the same team name to rejoin.</p>
      </div>
    `);
    const doJoin = async ()=>{
      const name = join.querySelector('#team-name').value.trim();
      if(!name) return;
      await teamJoin(name);
      startSync();
    };
    join.querySelector('#join-btn').onclick = doJoin;
    join.querySelector('#team-name').addEventListener('keydown', e=>{ if(e.key==='Enter') doJoin(); });
    wrap.appendChild(join);
    wrap.appendChild(renderSponsorFooter());
    return wrap;
  }

  const screen = sessionState.screen;
  if(screen === 'rules'){
    wrap.appendChild(el(`
      <div class="center-screen">
        <div class="eyebrow">Before we begin</div>
        <h1 class="display glow-pink" style="margin:0;">The rules</h1>
        ${renderRulesList()}
      </div>
    `));
  } else if(screen === 'setup' || screen === 'lobby'){
    wrap.appendChild(el(`
      <div class="center-screen">
        <div class="eyebrow">You're in</div>
        <h2 class="display" style="margin:0;">Waiting for the host to start</h2>
        <p class="muted">Sit tight, ${teamName}. The first round will appear here automatically.</p>
      </div>
    `));
  } else if(screen === 'question'){
    const round = config.rounds[sessionState.roundIndex];
    if(round.type === 'headsortails') wrap.appendChild(renderTeamHeadsOrTails(round));
    else if(round.type === 'nhie') wrap.appendChild(renderTeamNhie(round));
    else if(round.type === 'auction') wrap.appendChild(renderTeamAuction(round));
    else wrap.appendChild(renderTeamQuestion());
  } else if(screen === 'reveal'){
    const round = config.rounds[sessionState.roundIndex];
    if(round.type === 'headsortails' || round.type === 'nhie'){
      // these round types never enter reveal, but guard just in case
      wrap.appendChild(el(`<div class="center-screen"><p class="muted">Watch the screen!</p></div>`));
    } else {
      wrap.appendChild(renderTeamReveal());
    }
  } else if(screen === 'roundscore'){
    const ri = sessionState.roundIndex;
    const scores = computeScores();
    const mine = scores.find(s=>s.teamKey===teamKey);
    wrap.appendChild(el(`
      <div class="center-screen">
        <div class="eyebrow">${config.rounds[ri].name}</div>
        <h1 class="display glow-cyan" style="font-size:56px;margin:0;">${mine ? mine.roundScores[ri] : 0}</h1>
        <p class="muted">points this round</p>
        <p class="muted">Overall total so far: ${mine ? mine.total : 0}</p>
      </div>
    `));
  } else if(screen === 'survivors'){
    const round = config.rounds[sessionState.roundIndex];
    const out = isEliminated(round, round.questions.length, teamKey);
    wrap.appendChild(el(`
      <div class="center-screen">
        <div class="eyebrow">${round.name} &middot; just for fun, no points</div>
        <h1 class="display ${out ? '' : 'glow-cyan'}" style="margin:0;">${out ? "You're out!" : "You're still standing!"}</h1>
        <p class="muted">${out ? 'Better luck in the next one.' : 'Nicely done.'}</p>
      </div>
    `));
  } else if(screen === 'answers'){
    const round = config.rounds[sessionState.roundIndex - 1];
    if(round && round.questions.length){
      const qi = sessionState.questionIndex;
      const q = round.questions[qi];
      const answerText = q.type === 'mc' ? q.options[q.correct] : (q.answer || '');
      wrap.appendChild(el(`
        <div class="question-stage">
          <div class="eyebrow">${round.name} answers &middot; ${qi+1} of ${round.questions.length}</div>
          ${q.image ? `<img src="${q.image}" alt="" style="max-width:220px;max-height:180px;border-radius:14px;object-fit:cover;">` : ''}
          <div class="qtext display">${q.text}</div>
          <div class="display glow-cyan" style="font-size:24px;">${answerText}</div>
        </div>
      `));
    }
  } else if(screen === 'leaderboard'){
    wrap.appendChild(renderLeaderboard(false));
  } else if(screen === 'end'){
    wrap.appendChild(renderEnd(false));
  }
  wrap.appendChild(renderSponsorFooter());
  return wrap;
}

        <div class="timer-badge small">${QUESTION_TIMER_SECONDS}</div>
        ${imgTag}
        <div class="qtext display">${q.text}</div>
        ${already!==undefined
          ? `<p class="muted">Your answer: <strong>${already}</strong> (locked in)</p>`
          : `<div class="row"><input id="short-ans" placeholder="Type your answer" style="width:260px;"><button class="btn-primary" id="submit-short">Submit</button></div>`
        }
      </div>
    `);
    if(already===undefined){
      const submit = ()=>{
        const val = wrap.querySelector('#short-ans').value.trim();
        if(!val) return;
        teamSubmitAnswer(q.id, val);
      };
      wrap.querySelector('#submit-short').onclick = submit;
      wrap.querySelector('#short-ans').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    }
    return wrap;
  }
}

function renderTeamHeadsOrTails(round){
  const extra = sessionState.extra || {};
  return el(`
    <div class="question-stage">
      <div class="eyebrow">${round.name}</div>
      <div class="display glow-cyan" style="font-size:44px;">${extra.flipResult ? extra.flipResult : 'Heads or tails?'}</div>
      ${coinMarkup(extra)}
    </div>
  `);
}

function renderTeamNhie(round){
  const q = round.questions[sessionState.questionIndex];
  return el(`
    <div class="question-stage">
      <div class="eyebrow">${round.name}</div>
      <div class="qtext display glow-pink">${q ? q.text : ''}</div>
    </div>
  `);
}

function renderTeamAuction(round){
  const q = round.questions[sessionState.questionIndex];
  const imgs = (q && q.images) || [];
  let imgHtml = '';
  if(imgs.length === 1){
    imgHtml = `<img src="${imgs[0]}" alt="" style="max-width:260px;max-height:220px;border-radius:14px;object-fit:cover;">`;
  } else if(imgs.length > 1){
    imgHtml = `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
      ${imgs.map(src=>`<img src="${src}" alt="" style="width:120px;height:100px;border-radius:10px;object-fit:cover;">`).join('')}
    </div>`;
  }
  return el(`
    <div class="question-stage">
      <div class="eyebrow">${round.name}</div>
      ${imgHtml}
      <h1 class="display glow-cyan" style="margin:0;font-size:28px;">${q ? q.text : ''}</h1>
      ${q && q.description ? `<p class="muted">${q.description}</p>` : ''}
      ${q && q.detail ? `<div class="pill">${q.detail}</div>` : ''}
    </div>
  `);
}

function renderTeamReveal(){
  const q = currentQuestion();
  const ans = myAnswers[q.id];
  let status = 'pending';
  if(q.type === 'mc'){
    status = ans !== undefined ? (Number(ans)===Number(q.correct) ? 'correct' : 'wrong') : 'none';
  } else {
    if(marks[q.id] && marks[q.id][teamKey] !== undefined){
      status = marks[q.id][teamKey] ? 'correct' : 'wrong';
    } else {
      status = 'waiting';
    }
  }
  const waitingLabel = q.type === 'lyric' ? 'Waiting for the host to score your performance' : 'Waiting for host to mark this one';
  const label = { correct:'Correct!', wrong:'Not quite', none:'No answer submitted', waiting:waitingLabel }[status];
  const color = status==='correct' ? 'var(--good)' : status==='wrong' ? 'var(--bad)' : 'var(--muted)';
  const imgTag = q.image ? `<img src="${q.image}" alt="" style="max-width:260px;max-height:220px;border-radius:14px;object-fit:cover;">` : '';
  return el(`
    <div class="center-screen">
      <div class="eyebrow">Answer reveal</div>
      ${imgTag}
      <div class="qtext display">${q.text}</div>
      <div class="display" style="font-size:28px;color:${color};">${label}</div>
    </div>
  `);
}

render();
</script>
</body>
</html>
